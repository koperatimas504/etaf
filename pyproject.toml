[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etaf-agent"
version = "0.1.0"
description = "Evidence-tier-aware autonomous multi-agent drug repurposing for uveal melanoma"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "confection>=0.1.4",
    "arguably>=1.2",
]

[project.optional-dependencies]
dev = ["ruff", "black", "isort", "mypy", "pytest"]
backbones = ["transformers", "scprint"]

[project.scripts]
etaf-agent = "etaf_agent.keyring.__main__:main"

[tool.setuptools.packages.find]
include = ["etaf_agent*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["etaf_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["etaf_agent"]

[tool.mypy]
python_version = "3.11"
files = ["etaf_agent"]
strict = true
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["assays"]
addopts = "-q"
